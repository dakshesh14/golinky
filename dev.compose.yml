services:
  postgres:
    image: postgres:15
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: golinky-user
      POSTGRES_PASSWORD: golinky-password
      POSTGRES_DB: golinky
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: compose/dev/Dockerfile
    ports:
      - 8080:8080
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
    command: /start.sh

volumes:
  postgres_data:
  redis_data:
